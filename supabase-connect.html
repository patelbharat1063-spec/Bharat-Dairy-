<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bharat Dairy — Supabase Connection Test</title>
  <style>
    :root {
      --green: #176b4d;
      --bg: #f3f7f4;
      --text: #18352a;
      --border: #d7e5dc;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 24px auto;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }

    main {
      background: white;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 5px 20px #18352a12;
    }

    h1 { margin-top: 0; }
    p { line-height: 1.6; }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      background: var(--green);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #f3f7f4;
      border: 1px solid var(--border);
    }

    .note {
      font-size: 14px;
      color: #52685c;
    }
  </style>
</head>
<body>
  <main>
    <h1>🐄 Bharat Dairy</h1>
    <h2>Supabase Connection Test</h2>

    <p>
      This page checks whether the Bharat Dairy Supabase client
      can initialize and check the current login session.
    </p>

    <p class="note">
      This test does not insert, update, or delete any database records.
      It does not yet verify access to animal or farmer tables.
    </p>

    <button id="test" type="button">Test Connection</button>
    <p id="result" role="status" aria-live="polite">Ready to test.</p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://geqqdroiybkaucpuajfo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_OfvIta_9u1d37UXiDyPHmw_xrtBSDvC";

    const button = document.getElementById("test");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "Checking Supabase configuration…";

      try {
        if (!SUPABASE_KEY || !SUPABASE_KEY.startsWith("sb_publishable_")) {
          throw new Error(
            "Check that the correct Supabase publishable key is entered."
          );
        }

        const client = createClient(SUPABASE_URL, SUPABASE_KEY);
        const { error } = await client.auth.getSession();

        if (error) throw error;

        result.textContent =
          "Supabase client initialized successfully.\n\n" +
          "Session check completed.\n" +
          "No database records were changed.\n\n" +
          "Note: This does not yet confirm that your database tables " +
          "or existing animal records are accessible.";
      } catch (error) {
        result.textContent =
          "Connection test failed.\n\n" +
          (error?.message || "Unknown error") +
          "\n\nCheck the project URL, publishable key, and network connection.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>

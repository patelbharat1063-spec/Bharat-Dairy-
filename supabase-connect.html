
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bharat Dairy — Supabase Connection Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 32px auto; padding: 16px; background: #f3f7f4; color: #18352a; }
    main { background: white; padding: 22px; border-radius: 14px; }
    button { padding: 12px 16px; border: 0; border-radius: 8px; background: #176b4d; color: white; font-size: 16px; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 16px; }
  </style>
</head>
<body>
<main>
  <h1>Bharat Dairy</h1>
  <h2>Supabase connection test</h2>
  <p>This test checks the connection without inserting, updating, or deleting records.</p>
  <button id="test">Test connection</button>
  <p id="result">Ready to test.</p>
</main>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://geqqdroiybkaucpuajfo.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const result = document.getElementById("result");

document.getElementById("test").addEventListener("click", async () => {
  result.textContent = "Checking Supabase configuration…";

  if (!SUPABASE_KEY ||
      SUPABASE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE") {
    result.textContent = "Please add your Supabase publishable/anon key first.";
    return;
  }

  try {
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data, error } = await client.auth.getSession();

    if (error) throw error;

    result.textContent =
      "Supabase client initialized successfully.\n" +
      "Connection configuration is valid.\n" +
      "Session check completed.\n" +
      "No animal records were changed.\n" +
      "This does not yet verify database table access.";
  } catch (error) {
    result.textContent = "Test failed: " + error.message;
  }
});
</script>
</body>
</html>
